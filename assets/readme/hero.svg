<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">MerchantId</title>
  <desc id="heroDesc">Toolkit QRIS dinamis dan rekonsiliasi transaksi multi-provider untuk GoPay dan Shopee Merchant, dengan pembayaran yang diisolasi per provider, account, dan merchant-store.</desc>

  <defs>
    <clipPath id="scopeCardClip">
      <rect x="0" y="64" width="468" height="252" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1200" height="380" rx="22" fill="#0B0D0C"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="100"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="19" letter-spacing="3" fill="#6F746F">QRIS · MULTI-PROVIDER · INDONESIA</text>

    <text x="0" y="184"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="78" font-weight="700" letter-spacing="-1.8" fill="#F5F5F2">MerchantId</text>

    <rect x="0" y="208" width="74" height="3" rx="1.5" fill="#57C99A"/>

    <text x="0" y="256"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="23" fill="#C6C9C5">QRIS dinamis dan settlement multi-provider.</text>
    <text x="0" y="288"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="23" fill="#C6C9C5">GoPay dan Shopee, satu payment core.</text>

    <text x="0" y="334"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" fill="#6F746F">0 runtime dependency   ·   TypeScript   ·   MIT</text>
  </g>

  <g id="project-proof" transform="translate(668 0)">
    <rect x="0" y="64" width="468" height="252" rx="14" fill="#111413" stroke="#1F2422" stroke-width="1.5"/>

    <g clip-path="url(#scopeCardClip)">
      <g transform="translate(24 86)" fill="none" stroke="#57C99A" stroke-width="2">
        <rect x="0" y="0" width="40" height="40" rx="7"/>
        <rect x="8" y="8" width="24" height="24" rx="5"/>
        <circle cx="20" cy="20" r="4" fill="#57C99A" stroke="none"/>
      </g>

      <text x="80" y="106"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" letter-spacing="1.6" fill="#8A8F8A">PAYMENT SCOPE</text>
      <text x="80" y="130"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="18" fill="#636863">provider / account / merchant-store</text>

      <line x1="24" y1="150" x2="444" y2="150" stroke="#1F2422" stroke-width="1.5"/>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <rect x="24" y="166" width="82" height="28" rx="6" fill="#16231E"/>
        <text x="65" y="186" font-size="18" fill="#57C99A" text-anchor="middle">gopay</text>
        <text x="120" y="186" font-size="18" fill="#8A8F8A">G000... / outlet-1</text>
        <text x="444" y="186" font-size="22" fill="#F5F5F2" text-anchor="end">Rp 10.001</text>

        <rect x="24" y="206" width="82" height="28" rx="6" fill="#2A2315"/>
        <text x="65" y="226" font-size="18" fill="#E9B44C" text-anchor="middle">shopee</text>
        <text x="120" y="226" font-size="18" fill="#8A8F8A">merchant-7 / store-2</text>
        <text x="444" y="226" font-size="22" fill="#F5F5F2" text-anchor="end">Rp 10.001</text>
      </g>

      <line x1="24" y1="252" x2="444" y2="252" stroke="#1F2422" stroke-width="1.5"/>

      <circle cx="30" cy="286" r="5" fill="#57C99A"/>
      <text x="48" y="292"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" fill="#57C99A">STORE-2 · Rp 10.001 · order-42 paid</text>
    </g>
  </g>
</svg>
