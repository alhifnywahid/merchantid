name: Publish Package

on:
  # A pushed version tag is the single release trigger. `npm version <bump>`
  # writes package.json, commits, and creates the matching `vX.Y.Z` tag;
  # `git push --follow-tags` sends it here. Creating the GitHub Release from
  # inside this job (below) rather than triggering off a `release` event avoids
  # the GITHUB_TOKEN recursion guard, which would otherwise leave a Release that
  # never publishes.
  push:
    tags: ["v*"]
  workflow_dispatch:

# Never let two publishes race: a re-run alongside the original tag event
# could otherwise both reach `npm publish`.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for npm trusted publishing (OIDC)
      contents: write # Required to create the GitHub Release
    steps:
      # Actions are pinned by commit SHA, not by tag: a tag can be moved, and
      # this job holds an OIDC token that can publish to npm.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 ships npm >= 11.5.1, which trusted publishing requires.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Verify the tag matches the manifest version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Pushed tag $TAG does not match package.json $VERSION" >&2
            echo "Run 'npm version <patch|minor|major>' so the tag and manifest agree." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      # Provenance only works inside CI (OIDC); --provenance here, not in
      # package.json, so a manual `npm publish` from a maintainer's machine
      # does not fail with "Automatic provenance generation not supported".
      - name: Publish to npm
        run: npm publish --provenance --access public

      # The Release is created only after a successful publish, so a GitHub
      # Release always means the version is truly live on npm. Auto-generated
      # notes come from the commits/PRs since the previous tag. Guarded to tag
      # pushes; a manual workflow_dispatch has no tag to release.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it untouched."
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
